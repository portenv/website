<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og-image template · Portenv</title>
<!--
  Source for /og-image.png (1200×630). Render at exactly 1200×630, for example:
    chrome --headless=new --window-size=1200,630 --screenshot=og-image.png og/og-image.html
  Everything sits in a centered 560px column, inside the central 1000×500 and
  inside the 630×630 square some chat apps crop to.
  After changing the image, bump ?v= in the og:image and twitter:image tags.
-->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #f4f2ec; color: #16181c;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 560px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  .logo { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { margin: 0; font-size: 68px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; }
  p { margin: 0; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; color: #4a4d55; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img class="brand-icon" src="../icon.svg" width="46" height="46" alt="">
      Portenv
    </div>
    <h1>Hire a team of AI agents.</h1>
    <p>Keep the keys.</p>
  </div>
</body>
</html>
